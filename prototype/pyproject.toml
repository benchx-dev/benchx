[project]
name = "benchx-prototype"
version = "0.1.0"
description = "Prototype of the benchx design docs: runner, Google Benchmark adapter, Parquet store, run-mode comparator"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=19",
    # format-nongpl makes `format: uri` and `format: date-time` actually checked.
    "jsonschema[format-nongpl]>=4.18",
    "jsonpointer>=2.0",
    "referencing",
    "rfc8785",
]

[project.optional-dependencies]
test = ["pytest", "pyperf"]

[project.scripts]
bx = "benchx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchx"]
