[project]
name = "benchx"
dynamic = ["version"]
description = "BenchX: a flexible and powerful benchmarking framework"
license = "Apache-2.0 AND MIT"
# MIT is uPlot's, vendored for `bx view` under src/benchx/views/static/vendor/uplot.
license-files = ["LICENSE", "src/benchx/views/static/vendor/uplot/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    # Format validators for the formats used by the shipped schemas (`date-time`, `uri`).
    "rfc3339-validator",
    "rfc3986-validator>0.1.0",
    "referencing",
    "rfc8785",
]
readme = "docs/benchx.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Documentation = "https://benchx.dev/benchx/"
Repository = "https://github.com/benchx-dev/benchx"

[project.optional-dependencies]
parquet = ["pyarrow>=19"]
test = ["pytest", "pyperf", "asv_runner", "markdown-it-py"]

[project.scripts]
bx = "benchx.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/benchx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benchx"]

# The test suite ships inside the package, as benchx/tests, so an installed benchx can test
# itself: `python -m pytest --pyargs benchx`. Not as a top-level `tests` package, which would
# collide with other projects' in site-packages. Editable installs do not get it: their
# package is the source directory, and the checkout has tests/.
[tool.hatch.build.targets.wheel.force-include]
"tests" = "benchx/tests"

# `coverage run -m pytest tests`, then `coverage report`; CI runs it in the coverage job of
# tests.yml. Only the test process is measured: the subprocesses the tests start (`bx`, the
# harness workers) mostly run code the tests also reach in-process, and measuring them too
# (`patch = ["subprocess"]`) barely moves any file's number while slowing the run a lot.
# asv_runtime.py and benchx_params.py are run as copies beside each case's driver, so
# coverage cannot see what the workers run of them: their misses are not dead code.
[tool.coverage.run]
source_pkgs = ["benchx"]
branch = true

[tool.coverage.report]
skip_covered = true
sort = "cover"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is enforced by `ruff format`
    "E741",  # short variable names like `l` in comprehensions
    "B905",  # zip() without explicit strict=
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]  # imports after pytest.importorskip()
