[project]
name = "benchx"
version = "0.1.0"
description = "BenchX: a flexible and powerful benchmarking framework"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=19",
    # format-nongpl makes `format: uri` and `format: date-time` actually checked.
    "jsonschema[format-nongpl]>=4.18",
    "jsonpointer>=2.0",
    "referencing",
    "rfc8785",
]
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.urls]
Documentation = "https://benchx-dev.github.io/benchx/benchx/"
Repository = "https://github.com/benchx-dev/benchx"

[project.optional-dependencies]
test = ["pytest", "pyperf", "asv_runner"]

[project.scripts]
bx = "benchx.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchx"]
