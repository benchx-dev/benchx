name: e2e examples

# Runs examples from benchx-dev/benchx_examples and prints their output. Five jobs:
#
#   numpy-spin  builds NumPy with spin and benchmarks it:
#                 track.sh        several revisions, each built and benchmarked
#                 num_threads.sh  one prebuilt revision at several OPENBLAS_NUM_THREADS
#   arrow       builds a small Google Benchmark suite with CMake and compares the builds:
#                 examples/arrow/demo/run.sh
#                 examples/arrow/archery-local/run.sh
#   pyperf-suite  runs a suite of Python functions with `bx bench`:
#                 examples/pyperf-suite/run.sh
#   matmul-params  runs one parametrized benchmark, numpy and torch at three sizes, with
#                 `bx bench`; the quick version from the example's README:
#                 examples/matmul-params
#   numpy-venvs  measures the same benchmarks under two numpy versions, each in its own venv,
#                 with a `bx bench` call per side and round, and compares them:
#                 examples/numpy-venvs/run.sh
#
# Nothing is checked. The job fails only if a step fails (a clone, a build, a script that
# crashes); the scripts exit 0 even when a revision fails, so read the printed output.
#
# Runs on every pull request, and on demand. A run on demand can take another
# benchx_examples branch, tag or commit (examples_ref), which a pull request here cannot:
# the examples live in another repository.
#
# In the numpy-spin job the benchmarks are pinned to two cores (BENCH_CPUS). num_threads.sh
# should use 1, 2 and 4 threads, so that the last of them oversubscribes the two cores. The
# NumPy builds are not pinned.
#
on:
  workflow_dispatch:
    inputs:
      examples_ref:
        description: "benchx_examples branch, tag or commit to run"
        default: main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  numpy-spin:
    name: numpy-spin (track.sh, num_threads.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      NUMPY: ${{ github.workspace }}/numpy
      EXAMPLE: ${{ github.workspace }}/benchx_examples/examples/numpy-spin
      BENCH_CPUS: "0,1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Check out benchx
        uses: actions/checkout@v4
        with:
          path: benchx

      - name: Clone benchx_examples
        uses: actions/checkout@v4
        with:
          repository: benchx-dev/benchx_examples
          ref: ${{ inputs.examples_ref || 'main' }}
          path: benchx_examples

      # The repository keeps the output of earlier runs next to the scripts.
      # Start clean instead
      - name: Remove the output from examples/numpy-spin
        working-directory: ${{ env.EXAMPLE }}
        run: rm -rf results store.parquet

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev pkg-config ccache

      # The key is new for every run, because a cache cannot be overwritten; a run starts
      # from the most recent one. It is saved at the end, also when a later step fails.
      - name: Restore the ccache cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Zero the ccache statistics
        run: ccache --zero-stats

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: benchx/uv.lock

      # The scripts run plain `python`, `bx` and `spin`, and hard-code
      # lib/python3.12/site-packages, so this is Python 3.12 on the PATH. The `test`
      # extra is only for pyperf, which the benchmarks need.
      - name: Install benchx on Python 3.12
        working-directory: benchx
        run: |
          uv python install 3.12
          uv sync --extra test --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install NumPy's build tools
        run: uv pip install --python benchx/.venv/bin/python spin ninja meson-python cython

      # The full history and the tags: track.sh checks out v2.4.3 and v2.4.0.
      - name: Clone NumPy
        run: |
          git clone --quiet https://github.com/numpy/numpy.git "$NUMPY"
          git -C "$NUMPY" submodule update --init

      # Two cores for the benchmarks, all of them for the builds, so only `bx` is pinned:
      # a `bx` ahead of the real one on the PATH, which the scripts call without knowing.
      - name: Pin the benchmarks to two cores
        run: |
          mkdir -p "$RUNNER_TEMP/pin"
          cat > "$RUNNER_TEMP/pin/bx" <<EOF
          #!/bin/sh
          exec taskset -c $BENCH_CPUS $PWD/benchx/.venv/bin/bx "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/pin/bx"
          echo "$RUNNER_TEMP/pin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pin/bx" --help > /dev/null

      - name: Show what is under test
        run: |
          echo "python: $(python --version) ($(command -v python))"
          echo "bx: $(command -v bx)"
          echo "ccache: $(ccache --version | head -1)"
          echo "benchx: $(git -C benchx rev-parse --short HEAD)"
          echo "benchx_examples: $(git -C benchx_examples rev-parse --short HEAD)"
          echo "numpy main: $(git -C "$NUMPY" rev-parse --short main)"

      # num_threads.sh assumes a prebuilt NumPy at main, checked out.
      - name: Build NumPy main
        working-directory: ${{ env.NUMPY }}
        run: spin build

      # Before track.sh, which leaves the NumPy checkout at the last revision it built.
      - name: Run num_threads.sh
        working-directory: ${{ env.EXAMPLE }}
        run: bash ./num_threads.sh

      - name: Print the thread sweep results
        working-directory: ${{ env.EXAMPLE }}
        run: bx head --table -n 100

      - name: Run track.sh
        working-directory: ${{ env.EXAMPLE }}
        run: bash ./track.sh

      - name: Print the results across history
        working-directory: ${{ env.EXAMPLE }}
        run: bx head --table -n 100

      - name: Show the ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save the ccache cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-spin-output
          path: |
            benchx_examples/examples/numpy-spin/results
            benchx_examples/examples/numpy-spin/store.parquet
          if-no-files-found: warn
          retention-days: 14

  arrow:
    name: arrow (demo, archery-local)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out benchx
        uses: actions/checkout@v4
        with:
          path: benchx

      - name: Clone benchx_examples
        uses: actions/checkout@v4
        with:
          repository: benchx-dev/benchx_examples
          ref: ${{ inputs.examples_ref || 'main' }}
          path: benchx_examples

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: benchx/uv.lock

      # The scripts run plain `python` and `bx`. benchx is installed in editable mode,
      # which is where it reads its schemas from.
      - name: Install benchx
        working-directory: benchx
        run: |
          uv python install 3.13
          uv sync --extra test --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # cmake and a C++ compiler are preinstalled on the runner; CMake fetches
      # Google Benchmark.
      - name: Show what is under test
        run: |
          echo "python: $(python --version) ($(command -v python))"
          echo "bx: $(command -v bx)"
          echo "cmake: $(cmake --version | head -1)"
          echo "c++: $(c++ --version | head -1)"
          echo "benchx: $(git -C benchx rev-parse --short HEAD)"
          echo "benchx_examples: $(git -C benchx_examples rev-parse --short HEAD)"

      - name: Run the demo
        working-directory: benchx_examples/examples/arrow/demo
        run: bash ./run.sh

      - name: Run archery-local
        working-directory: benchx_examples/examples/arrow/archery-local
        run: bash ./run.sh

      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrow-output
          path: |
            benchx_examples/examples/arrow/demo/store.parquet
            benchx_examples/examples/arrow/archery-local/_work/results
          if-no-files-found: warn
          retention-days: 14

  pyperf-suite:
    name: pyperf-suite (run.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out benchx
        uses: actions/checkout@v4
        with:
          path: benchx

      - name: Clone benchx_examples
        uses: actions/checkout@v4
        with:
          repository: benchx-dev/benchx_examples
          ref: ${{ inputs.examples_ref || 'main' }}
          path: benchx_examples

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: benchx/uv.lock

      # The script runs plain `python` and `bx`, and the workers need pyperf, which the
      # `test` extra brings. benchx is installed in editable mode, which is where it reads
      # its schemas from.
      - name: Install benchx
        working-directory: benchx
        run: |
          uv python install 3.13
          uv sync --extra test --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Show what is under test
        run: |
          echo "python: $(python --version) ($(command -v python))"
          echo "bx: $(command -v bx)"
          echo "pyperf: $(python -c 'import pyperf; print(pyperf.__version__)')"
          echo "benchx: $(git -C benchx rev-parse --short HEAD)"
          echo "benchx_examples: $(git -C benchx_examples rev-parse --short HEAD)"

      - name: Run the pyperf suite
        working-directory: benchx_examples/examples/pyperf-suite
        run: bash ./run.sh

      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyperf-suite-output
          path: benchx_examples/examples/pyperf-suite/out
          if-no-files-found: warn
          retention-days: 14

  matmul-params:
    name: matmul-params (quick version)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep the result store with the output, as the README does, not in the home directory.
      BENCHX_HOME: ${{ github.workspace }}/benchx_examples/examples/matmul-params/out/home
    steps:
      - name: Check out benchx
        uses: actions/checkout@v4
        with:
          path: benchx

      - name: Clone benchx_examples
        uses: actions/checkout@v4
        with:
          repository: benchx-dev/benchx_examples
          ref: ${{ inputs.examples_ref || 'main' }}
          path: benchx_examples

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: benchx/uv.lock

      # The workers need pyperf, which the `test` extra brings. benchx is installed in
      # editable mode, which is where it reads its schemas from.
      - name: Install benchx
        working-directory: benchx
        run: |
          uv python install 3.13
          uv sync --extra test --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The README's install lines. torch comes from PyTorch's CPU index: the default
      # build is several GB of CUDA libraries that the runner has no use for.
      - name: Install NumPy and PyTorch
        run: |
          uv pip install --python benchx/.venv/bin/python numpy
          uv pip install --python benchx/.venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu

      - name: Show what is under test
        run: |
          echo "python: $(python --version) ($(command -v python))"
          echo "bx: $(command -v bx)"
          echo "pyperf: $(python -c 'import pyperf; print(pyperf.__version__)')"
          echo "numpy: $(python -c 'import numpy; print(numpy.__version__)')"
          echo "torch: $(python -c 'import torch; print(torch.__version__)')"
          echo "benchx: $(git -C benchx rev-parse --short HEAD)"
          echo "benchx_examples: $(git -C benchx_examples rev-parse --short HEAD)"

      # The quick version of the README: 2 processes x 2 values per case, 0.01 s of
      # calibration. With pyperf's defaults it takes several minutes, mostly importing torch
      # in every worker. `bx bench` prints one row per case.
      - name: Run the quick version
        working-directory: benchx_examples/examples/matmul-params
        run: bx bench bench_matmul.py --processes 2 --values 2 --min-time 0.01 --out out

      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matmul-params-output
          path: benchx_examples/examples/matmul-params/out
          if-no-files-found: warn
          retention-days: 14

  numpy-venvs:
    name: numpy-venvs (run.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out benchx
        uses: actions/checkout@v4
        with:
          path: benchx

      - name: Clone benchx_examples
        uses: actions/checkout@v4
        with:
          repository: benchx-dev/benchx_examples
          ref: ${{ inputs.examples_ref || 'main' }}
          path: benchx_examples

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: benchx/uv.lock

      # The script makes two venvs of its own with uv (Python 3.12, the newest with numpy
      # 1.26.4 wheels) and installs benchx in both, from BENCHX_SRC (set on the run step).
      # Left unset, it takes the checkout from the benchx of the active environment and assumes
      # that the package sits directly in the project directory, which it does not under src/.
      # The venvs bring their own pyperf.
      - name: Install benchx
        working-directory: benchx
        run: |
          uv python install 3.13
          uv sync --python 3.13
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Show what is under test
        run: |
          echo "python: $(python --version) ($(command -v python))"
          echo "uv: $(uv --version)"
          echo "benchx: $(git -C benchx rev-parse --short HEAD)"
          echo "benchx_examples: $(git -C benchx_examples rev-parse --short HEAD)"

      - name: Run the numpy-venvs example
        working-directory: benchx_examples/examples/numpy-venvs
        env:
          BENCHX_SRC: ${{ github.workspace }}/benchx
        run: bash ./run.sh

      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numpy-venvs-output
          path: benchx_examples/examples/numpy-venvs/out
          if-no-files-found: warn
          retention-days: 14
