name: release

# Publishes benchx to PyPI and creates the GitHub release, when the tag v<version> is pushed.
# docs/releasing.md is the checklist. A tag such as v0.1.0rc1 makes a pre-release.
#
# The package is tested before anything is uploaded. Conda packages are not built here: they
# come from the benchx feedstock on conda-forge, which follows the releases on PyPI.
#
# A pull request that changes the packaging runs the build job and uploads nothing.
#
# This needs, on GitHub, the pypi environment with its required reviewers, and on PyPI a trusted
# publisher for this file and that environment. The actions are pinned to commits since they
# handle the uploads.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the sdist, and the wheel from it
        run: uv build

      - name: Read the version from the sdist
        id: version
        run: |
          version=$(basename dist/benchx-*.tar.gz .tar.gz)
          version=${version#benchx-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the tag names this version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match the package version $VERSION"
            exit 1
          fi

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean environment and test it
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          uv pip install "$(ls dist/*.whl)[test]"
          # Away from the checkout, so that nothing can import it instead of the installed package.
          cd "$RUNNER_TEMP"
          bx --help
          python -m pytest --pyargs benchx -ra

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    # Also what keeps the job after this one off pull requests and forks: it needs this one.
    if: github.repository == 'benchx-dev/benchx' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/benchx/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: release-files

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: gh release create "$TAG" release-files/* --verify-tag --generate-notes --prerelease="$PRERELEASE"
