name: release

# Publishes benchx to PyPI and anaconda.org, and creates the GitHub release. To release, set
# __version__ in src/benchx/__init__.py, merge that, and push the tag v<version> from main:
#
#   v0.1.0     goes to PyPI and to the main label on anaconda.org
#   v0.1.0rc1  goes to PyPI as a pre-release and to the rc label on anaconda.org
#
# Both packages are built and tested before anything is uploaded. PyPI versions cannot be
# reused, so PyPI goes first; if the anaconda.org upload fails, re-run that job.
#
# A pull request that changes the packaging runs the two build jobs and uploads nothing.
#
# This needs, on GitHub, the environments below with their required reviewers, the secret
# ANACONDA_API_KEY in the anaconda environment, and on PyPI a trusted publisher for this file
# and the pypi environment. The actions are pinned to commits since they handle the uploads.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "conda/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the sdist, and the wheel from it
        run: uv build

      - name: Read the version from the sdist
        id: version
        run: |
          version=$(basename dist/benchx-*.tar.gz .tar.gz)
          version=${version#benchx-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the tag names this version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match the package version $VERSION"
            exit 1
          fi

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean environment and test it
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          uv pip install "$(ls dist/*.whl)[test]"
          # Away from the checkout, so that nothing can import it instead of the installed package.
          cd "$RUNNER_TEMP"
          bx --help
          python -m pytest --pyargs benchx -ra

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  conda:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: rattler-build
          create-args: -c conda-forge rattler-build=0.80.0

      - name: Build and test the conda package from the sdist
        shell: bash -el {0}
        env:
          BENCHX_VERSION: ${{ needs.build.outputs.version }}
        run: |
          export BENCHX_SDIST="$PWD/dist/benchx-$BENCHX_VERSION.tar.gz"
          rattler-build build --recipe conda/recipe.yaml --output-dir conda-output -c conda-forge

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conda
          path: conda-output/noarch/*.conda
          if-no-files-found: error

  publish-pypi:
    needs: [build, conda]
    # Also what keeps the jobs after this one off pull requests and forks: they need this one.
    if: github.repository == 'benchx-dev/benchx' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/benchx/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-conda:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    environment:
      name: anaconda
      url: https://anaconda.org/BenchX/benchx
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conda
          path: conda-packages

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: rattler-build
          create-args: -c conda-forge rattler-build=0.80.0

      - name: Upload to anaconda.org
        shell: bash -el {0}
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
          LABEL: ${{ needs.build.outputs.prerelease == 'true' && 'rc' || 'main' }}
        run: rattler-build upload anaconda --owner BenchX --channel "$LABEL" conda-packages/*.conda

  github-release:
    needs: [build, publish-pypi, publish-conda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-files
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: gh release create "$TAG" release-files/* --verify-tag --generate-notes --prerelease="$PRERELEASE"
