name: prototype tests

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - "schemas/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "prototype/**"
      - "schemas/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: prototype/uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: uv sync --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --extra test --python ${{ matrix.python-version }} python -m pytest tests -ra

      - name: Run the pyperf-bench example
        shell: bash
        run: uv run --extra test --python ${{ matrix.python-version }} bash examples/pyperf-bench/run.sh

      # Needs cmake and a C++ compiler (preinstalled on the Linux and macOS
      # runners) and fetches Google Benchmark; the example is bash and CMake
      # with Unix paths, so it is not run on Windows.
      - name: Run the archery-local example
        if: runner.os != 'Windows'
        shell: bash
        run: uv run --extra test --python ${{ matrix.python-version }} bash examples/archery-local/run.sh

      # The end-to-end demo of both profiles: builds a small CMake project three
      # ways, then measures and compares it. Needs cmake and a C++ compiler
      # (preinstalled on the Linux and macOS runners) and network access to fetch
      # Google Benchmark. ROUNDS is lowered from the default of 5 to keep the job
      # short; it changes how many samples are taken, not what the script exercises.
      # Run directly, the way the README shows it, so a lost executable bit
      # fails here too.
      - name: Run the archery-compare example
        if: runner.os != 'Windows'
        shell: bash
        env:
          ROUNDS: "2"
        run: uv run --extra test --python ${{ matrix.python-version }} examples/archery-compare/run.sh
