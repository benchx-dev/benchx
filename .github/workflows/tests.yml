name: benchx tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Ruff lint
        run: uvx ruff==0.17.6 check src tests tools

      - name: Ruff format check
        run: uvx ruff==0.17.6 format --check src tests tools

  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: uv sync --extra parquet --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --extra parquet --extra test --python ${{ matrix.python-version }} python -m pytest tests -ra

  minimal:
    name: minimal (no pyarrow) / py3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install package without parquet extra
        run: uv sync --extra test --python 3.13

      - name: Verify pyarrow and jsonpointer are absent
        run: |
          uv run --extra test --python 3.13 python -c '
          import importlib.util
          for mod in ("pyarrow", "jsonpointer"):
              assert importlib.util.find_spec(mod) is None, f"unexpected dependency installed: {mod}"
          '

      - name: Run tests without pyarrow
        run: |
          uv run --extra test --python 3.13 bx --help > /dev/null
          uv run --extra test --python 3.13 python -m pytest tests -ra

  # An editable install finds the schemas next to the source, so the matrix above cannot
  # tell whether a wheel carries them. This installs the built wheel (not editable) into a
  # clean environment, runs `bx` from outside the checkout, and runs the test suite that the
  # wheel itself ships (benchx/tests), so it checks the wheel's contents as well as its code.
  wheel:
    name: wheel / py3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into a clean environment and test it
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          uv pip install "$(ls dist/*.whl)"
          # Away from the checkout, so that nothing can import it instead of the installed package.
          cd "$RUNNER_TEMP"
          python -c '
          import importlib.metadata
          reqs = importlib.metadata.requires("benchx") or []
          default_reqs = [r for r in reqs if "extra ==" not in r]
          parquet_reqs = [r for r in reqs if "extra ==" in r and "parquet" in r]
          assert any(r.startswith("pyarrow") for r in parquet_reqs), reqs
          for unwanted in ("pyarrow", "jsonpointer", "format-nongpl", "fqdn", "idna", "isoduration", "rfc3987-syntax", "uri-template", "webcolors"):
              assert not any(unwanted in r for r in default_reqs), f"unexpected default dep {unwanted!r} in {default_reqs}"
          '
          bx --help
          uv pip install "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)[test]"
          python -m pytest --pyargs benchx -ra
          uv pip install "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)[parquet,test]"
          python -m pytest --pyargs benchx -ra

  # Line and branch coverage of the suite (#87), as a starting point for finding dead code:
  # the table is in the job summary, the HTML report in the coverage-html artifact. Nothing
  # fails on the number. pyproject.toml ([tool.coverage]) says what is measured, and why a
  # few files look less covered than they are.
  coverage:
    name: coverage / py3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install package and test dependencies
        run: uv sync --extra parquet --extra test --python 3.13

      - name: Run tests under coverage
        run: uv run --extra parquet --extra test --with coverage --python 3.13 coverage run -m pytest tests -ra

      - name: Report
        if: always()
        run: |
          uv run --extra parquet --extra test --with coverage --python 3.13 coverage report
          {
            echo "## Coverage"
            echo
            uv run --extra parquet --extra test --with coverage --python 3.13 coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --extra parquet --extra test --with coverage --python 3.13 coverage html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14
