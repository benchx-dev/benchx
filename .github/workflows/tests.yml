name: benchx tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: uv sync --extra test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --extra test --python ${{ matrix.python-version }} python -m pytest tests -ra

  # An editable install finds the schemas next to the source, so the matrix above cannot
  # tell whether a wheel carries them. This installs the built wheel (not editable) into a
  # clean environment, runs `bx` from outside the checkout, and runs the test suite that the
  # wheel itself ships (benchx/tests), so it checks the wheel's contents as well as its code.
  wheel:
    name: wheel / py3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the wheel
        run: uv build --wheel

      - name: Install the wheel into a clean environment and test it
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          uv pip install "$(ls dist/*.whl)[test]"
          # Away from the checkout, so that nothing can import it instead of the installed package.
          cd "$RUNNER_TEMP"
          bx --help
          python -m pytest --pyargs benchx -ra
