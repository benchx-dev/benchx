name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "schemas/**"
      - "tools/gen_docs.py"
      - "zensical.toml"
      - "README.md"
      - "benchx/README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "schemas/**"
      - "tools/gen_docs.py"
      - "zensical.toml"
      - "README.md"
      - "benchx/README.md"
      - ".github/workflows/docs.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Generate derived pages (landing page, benchx page, schema reference)
        run: uv run --python 3.12 --with-requirements docs/requirements.txt python tools/gen_docs.py

      - name: Build site
        run: uv run --python 3.12 --with-requirements docs/requirements.txt zensical build --strict --clean

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
